<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Glimmer</title>
  <desc id="description">Nine softly glowing fireflies loosely trace a letter G against a deep midnight-blue night.</desc>
  <defs>
    <linearGradient id="night" x1="160" y1="96" x2="826" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142E57"/>
      <stop offset=".52" stop-color="#0B2041"/>
      <stop offset="1" stop-color="#061329"/>
    </linearGradient>
    <radialGradient id="air">
      <stop stop-color="#286382" stop-opacity=".24"/>
      <stop offset="1" stop-color="#286382" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop stop-color="#DFFF9D" stop-opacity=".42"/>
      <stop offset=".22" stop-color="#C9F88B" stop-opacity=".22"/>
      <stop offset=".52" stop-color="#A9E77D" stop-opacity=".065"/>
      <stop offset="1" stop-color="#9CE077" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="light" cx=".38" cy=".32" r=".75">
      <stop stop-color="#FCFFDB"/>
      <stop offset=".48" stop-color="#E7FFAD"/>
      <stop offset="1" stop-color="#BCE97E"/>
    </radialGradient>
    <linearGradient id="edge" x1="180" y1="80" x2="820" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91B8E3" stop-opacity=".22"/>
      <stop offset=".48" stop-color="#91B8E3" stop-opacity=".04"/>
      <stop offset="1" stop-color="#91B8E3" stop-opacity=".08"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="64" y="64" width="896" height="896" rx="202"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="64" y="64" width="896" height="896" rx="202" fill="url(#night)"/>
    <ellipse cx="422" cy="482" rx="450" ry="430" fill="url(#air)"/>
    <g>
      <!-- Uneven spacing and brightness suggest a G without drawing a letter. -->
      <circle cx="641" cy="302" r="74" fill="url(#halo)" opacity=".65"/>
      <circle cx="641" cy="302" r="12" fill="url(#light)" opacity=".85"/>
      <circle cx="477" cy="267" r="122" fill="url(#halo)" opacity=".95"/>
      <circle cx="477" cy="267" r="24" fill="url(#light)"/>
      <circle cx="326" cy="357" r="79" fill="url(#halo)" opacity=".7"/>
      <circle cx="326" cy="357" r="13" fill="url(#light)" opacity=".88"/>
      <circle cx="277" cy="522" r="116" fill="url(#halo)"/>
      <circle cx="277" cy="522" r="23" fill="url(#light)"/>
      <circle cx="361" cy="676" r="68" fill="url(#halo)" opacity=".6"/>
      <circle cx="361" cy="676" r="10" fill="url(#light)" opacity=".78"/>
      <circle cx="527" cy="722" r="126" fill="url(#halo)" opacity=".95"/>
      <circle cx="527" cy="722" r="25" fill="url(#light)"/>
      <circle cx="681" cy="652" r="80" fill="url(#halo)" opacity=".75"/>
      <circle cx="681" cy="652" r="14" fill="url(#light)" opacity=".9"/>
      <circle cx="717" cy="520" r="109" fill="url(#halo)" opacity=".9"/>
      <circle cx="717" cy="520" r="21" fill="url(#light)"/>
      <circle cx="574" cy="527" r="85" fill="url(#halo)" opacity=".75"/>
      <circle cx="574" cy="527" r="15" fill="url(#light)" opacity=".92"/>
    </g>
    <rect x="65" y="65" width="894" height="894" rx="201" stroke="url(#edge)" stroke-width="2"/>
  </g>
</svg>
