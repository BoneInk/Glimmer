name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to happen. If Wallpaper Engine already does this, say how.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Alternatives you considered, example wallpapers, screenshots.
