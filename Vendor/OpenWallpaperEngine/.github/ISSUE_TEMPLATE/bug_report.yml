name: Bug report
description: Something in the app doesn't work (crash, settings, Workshop, playback).
labels: [bug]
body:
  - type: input
    id: wallpaper
    attributes:
      label: Wallpaper ID or link
      description: The Steam Workshop ID or link, if a wallpaper is involved.
      placeholder: https://steamcommunity.com/sharedfiles/filedetails/?id=...
  - type: dropdown
    id: type
    attributes:
      label: Wallpaper type
      options: [Scene, Video, Web, Not wallpaper-specific]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong
      description: What you did, what happened, and what you expected. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Run `/usr/bin/log show --last 10m --predicate 'process == \"Open Wallpaper Engine\"'` shortly after the problem and paste the relevant part."
      render: text
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1
    validations:
      required: true
  - type: input
    id: owe
    attributes:
      label: Open Wallpaper Engine version
      description: From the About window.
      placeholder: 1.0.0-beta.3
    validations:
      required: true
